<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="backSheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle light accent arc on top edge -->
  <path d="M 112 0 Q 256 24 400 0" stroke="rgba(255,255,255,0.25)" stroke-width="4" fill="none" />

  <!-- Group with shadow for documents -->
  <g filter="url(#shadow)">
    <!-- Back document sheet (tilted) -->
    <g transform="translate(230, 240) rotate(-10) translate(-230, -240)">
      <rect x="156" y="116" width="180" height="236" rx="20" fill="url(#backSheetGrad)" />
      <!-- Document lines on back sheet -->
      <rect x="180" y="150" width="80" height="12" rx="6" fill="#94a3b8" />
      <rect x="180" y="174" width="130" height="8" rx="4" fill="#cbd5e1" />
      <rect x="180" y="194" width="110" height="8" rx="4" fill="#cbd5e1" />
      <rect x="180" y="214" width="124" height="8" rx="4" fill="#cbd5e1" />
    </g>

    <!-- Front main document sheet -->
    <g filter="url(#innerShadow)">
      <rect x="186" y="146" width="190" height="248" rx="24" fill="url(#sheetGrad)" />
      
      <!-- Top header line (Brand accent) -->
      <rect x="214" y="180" width="76" height="16" rx="8" fill="#059669" />
      <circle cx="346" cy="188" r="8" fill="#10b981" />
      
      <!-- Invoice rows / lines -->
      <rect x="214" y="218" width="134" height="10" rx="5" fill="#94a3b8" opacity="0.65" />
      <rect x="214" y="242" width="104" height="10" rx="5" fill="#cbd5e1" />
      <rect x="214" y="266" width="134" height="10" rx="5" fill="#cbd5e1" />
      <rect x="214" y="290" width="118" height="10" rx="5" fill="#cbd5e1" />

      <!-- Divider line -->
      <line x1="214" y1="320" x2="348" y2="320" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />

      <!-- Total row (Badge / Highlight) -->
      <rect x="214" y="336" width="60" height="12" rx="6" fill="#64748b" opacity="0.5" />
      <rect x="296" y="334" width="52" height="16" rx="8" fill="#059669" />
    </g>

    <!-- Fast / Dynamic Check Badge on bottom right corner -->
    <g transform="translate(346, 360)">
      <circle cx="0" cy="0" r="38" fill="#ffffff" filter="url(#innerShadow)" />
      <circle cx="0" cy="0" r="32" fill="#10b981" />
      <path d="M -12 0 L -4 8 L 14 -10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
